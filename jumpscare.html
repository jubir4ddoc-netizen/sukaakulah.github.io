<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Jumpscare Game</title>
<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }
    #start {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        cursor: pointer;
        font-size: 28px;
    }
    #scare {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        z-index: 999;
    }
    #scare img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>
</head>
<body>

<div id="start">KLIK UNTUK MULAI</div>

<div id="scare">
    <img src="jumpscare.jpg" alt="JUMPSCARE">
</div>

<script>
document.getElementById("start").onclick = function () {
    this.style.display = "none";

    setTimeout(() => {
        document.getElementById("scare").style.display = "block";
    }, 3000); // delay 3 detik
};
</script>

</body>
</html>
